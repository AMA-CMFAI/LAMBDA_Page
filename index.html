    <style>
        :root {
            /* Dark theme (default) */
            --bg: #000000;
            --text: #ffffff;
            --text-secondary: #888888;
            --accent: #666666;
            --surface: rgba(30,30,30,0.6);
            --border: rgba(255,255,255,0.1);
            --header-bg: rgba(0,0,0,0.65);
            --shadow: rgba(255,255,255,0.1);
            --button-bg: #ffffff;
            --button-text: #000000;
            --button-hover-bg: transparent;
            --button-hover-text: #ffffff;
            --button-hover-border: #ffffff;
        }

        [data-theme="light"] {
            /* Light theme */
            --bg: #f5f5f7;
            --text: #1d1d1f;
            --text-secondary: #6e6e73;
            --accent: #86868b;
            --surface: rgba(255,255,255,0.8);
            --border: rgba(0,0,0,0.1);
            --header-bg: rgba(255,255,255,0.8);
            --shadow: rgba(0,0,0,0.1);
            --button-bg: #1d1d1f;
            --button-text: #ffffff;
            --button-hover-bg: transparent;
            --button-hover-text: #1d1d1f;
            --button-hover-border: #1d1d1f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        #bg-gif {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: url('sources/images/LAMBDA_mix_250710_large.gif') center center / cover no-repeat;
            opacity: 0.4;
            pointer-events: none;
        }

        #bg-gif::after {
            content: '';
            position: absolute;
            inset: 0;
            background: inherit;
            filter: blur(20px);
            transform: scale(1.1);
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: transparent;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -2px;
        }

        .theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text);
            font-size: 1.2rem;
            padding: 0.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            opacity: 0.7;
        }

        .theme-toggle:hover {
            opacity: 1;
            background: var(--surface);
        }

        .theme-toggle .moon-icon {
            display: none;
        }

        [data-theme="light"] .theme-toggle .sun-icon {
            display: none;
        }

        [data-theme="light"] .theme-toggle .moon-icon {
            display: block;
        }

        nav a {
            color: var(--text);
            text-decoration: none;
            margin-left: 2.5rem;
            font-weight: 500;
            opacity: 0.8;
            transition: opacity .3s;
        }

        nav a:hover {
            opacity: 1;
        }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 10%;
            position: relative;
        }

        .hero h1 {
            font-size: 14vw;
            font-weight: 900;
            letter-spacing: -0.05em;
            line-height: 0.9;
            margin-bottom: 2rem;
            background: linear-gradient(90deg, #fff, #aaa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        [data-theme="light"] .hero h1 {
            background: linear-gradient(90deg, #1d1d1f, #515154);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .hero p {
            max-width: 800px;
            font-size: 1.5rem;
            line-height: 1.6;
            opacity: 0.8;
            margin-bottom: 4rem;
            color: var(--text);
        }

        .buttons a {
            display: inline-block;
            margin: 0 1rem;
            padding: 1rem 2.5rem;
            background: var(--button-bg);
            border: 2px solid var(--button-bg);
            color: var(--button-text);
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: all .4s ease;
            box-shadow: 0 4px 12px var(--shadow);
        }

        .buttons a:hover {
            background: var(--button-hover-bg);
            border-color: var(--button-hover-border);
            color: var(--button-hover-text);
            box-shadow: 0 8px 24px var(--shadow);
            transform: translateY(-2px);
        }

        /* 如果你想让某个按钮更突出（如 Download），可以加 class="primary" */
        .buttons a.primary {
            background: var(--button-bg);
            border-color: var(--button-bg);
            color: var(--button-text);
            font-weight: 700;
        }

        .buttons a.primary:hover {
            background: var(--button-hover-bg);
            border-color: var(--button-hover-border);
            color: var(--button-hover-text);
        }

        /* Floating circular images */
        .floating-img {
            position: absolute;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 0 80px rgba(255, 255, 255, 0.15);
            animation: float 20s infinite linear;
        }

        .floating-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #img1 {
            width: 220px;
            height: 220px;
            top: 15%;
            left: 12%;
        }

        #img2 {
            width: 180px;
            height: 180px;
            top: 20%;
            right: 15%;
        }

        #img3 {
            width: 200px;
            height: 200px;
            bottom: 15%;
            left: 18%;
            animation-delay: -10s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            100% {
                transform: translate(30px, -30px) rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 20vw;
            }

            nav a {
                margin-left: 1.2rem;
                font-size: 0.9rem;
            }

            .floating-img {
                display: none;
            }
        }
    </style>

<script>
    (function() {
        const themeToggle = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        // Apply saved theme or system preference
        if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
        } else if (!prefersDark) {
            document.documentElement.setAttribute('data-theme', 'light');
        }

        themeToggle.addEventListener('click', function() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';

            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });
    })();
</script>
