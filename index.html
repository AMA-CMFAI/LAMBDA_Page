  <style>
    :root {
      --bg: #000000;
      --text: #ffffff;
      --accent: #aaaaaa;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    #bg-gif {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: url('sources/images/LAMBDA_mix_250710_large.gif') center center / cover no-repeat;
      opacity: 0.4;
      pointer-events: none;
    }

    #bg-gif::after {
      content: '';
      position: absolute;
      inset: 0;
      background: inherit;
      filter: blur(20px);
      transform: scale(1.1);
    }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 2rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }
    .logo {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -2px;
    }
    nav a {
      color: var(--text);
      text-decoration: none;
      margin-left: 2.5rem;
      font-weight: 500;
      opacity: 0.8;
      transition: opacity .3s;
    }
    nav a:hover { opacity: 1; }

    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 10%;
      position: relative;
    }
    .hero h1 {
      font-size: 14vw;
      font-weight: 900;
      letter-spacing: -0.05em;
      line-height: 0.9;
      margin-bottom: 2rem;
      background: linear-gradient(90deg, #fff, #aaa);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero p {
      max-width: 800px;
      font-size: 1.5rem;
      line-height: 1.6;
      opacity: 0.8;
      margin-bottom: 4rem;
    }

    .buttons a {
      display: inline-block;
      margin: 0 1rem;
      padding: 1rem 2.5rem;
      background: transparent;
      border: 2px solid rgba(255,255,255,0.3);
      color: white;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      transition: all .4s;
    }
    .buttons a:hover {
      background: rgba(255,255,255,0.1);
      border-color: white;
    }

    /* Floating circular images */
    .floating-img {
      position: absolute;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 0 80px rgba(255,255,255,0.15);
      animation: float 20s infinite linear;
    }
    .floating-img img { width: 100%; height: 100%; object-fit: cover; }
    #img1 { width: 220px; height: 220px; top: 15%; left: 12%; }
    #img2 { width: 180px; height: 180px; top: 20%; right: 15%; }
    #img3 { width: 200px; height: 200px; bottom: 15%; left: 18%; animation-delay: -10s; }

    @keyframes float {
      0% { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(30px, -30px) rotate(360deg); }
    }

    @media (max-width: 768px) {
      .hero h1 { font-size: 20vw; }
      nav a { margin-left: 1.2rem; font-size: 0.9rem; }
      .floating-img { display: none; }
    }
  </style>
</head>
