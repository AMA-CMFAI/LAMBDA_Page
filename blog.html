<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blog – LAMBDA</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="icon" type="image/png" href="sources/images/logo.png">
  <link rel="apple-touch-icon" type="image/png" href="sources/images/logo.png">
  <style>
    :root {
      /* Dark theme (default) */
      --bg: #000000;
      --surface: rgba(20,20,20,0.8);
      --text: #f5f5f7;
      --text-secondary: #a1a1a6;
      --border: rgba(255,255,255,0.08);
      --header-bg: rgba(0,0,0,0.65);
    }

    [data-theme="light"] {
      /* Light theme */
      --bg: #f5f5f7;
      --surface: rgba(255,255,255,0.9);
      --text: #1d1d1f;
      --text-secondary: #6e6e73;
      --border: rgba(0,0,0,0.08);
      --header-bg: rgba(255,255,255,0.8);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      transition: background 0.3s, color 0.3s;
    }
    header { /* 同 cases 的 header，复用感一致 */
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 1.2rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      background: var(--header-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: background 0.3s;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 2rem;
    }
    .logo img {
      height: 2.5rem;
      width: auto;
      display: block;
    }
    .theme-toggle {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text);
      font-size: 1.2rem;
      padding: 0.5rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      opacity: 0.7;
    }
    .theme-toggle:hover {
      opacity: 1;
      background: var(--surface);
    }
    .theme-toggle .moon-icon { display: none; }
    [data-theme="light"] .theme-toggle .sun-icon { display: none; }
    [data-theme="light"] .theme-toggle .moon-icon { display: block; }
    nav a {
      color: var(--text);
      text-decoration: none;
      margin-left: 2rem;
      font-size: 1rem;
      opacity: 0.85;
      transition: opacity 0.3s;
    }
    nav a:hover, nav a.active { opacity: 1; }

    main {
      padding: 7rem 6% 6rem;
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 {
      font-size: 3.8rem;          /* 缩小，不再占满屏 */
      font-weight: 700;
      letter-spacing: -0.02em;
      text-align: center;
      margin: 0 0 3.5rem 0;       /* 上下间距收紧 */
      color: var(--text);
    }
    .post-list {
      display: grid;
      gap: 2.2rem;
    }
    .post {
      padding: 2rem 2.2rem;
      border-radius: 18px;
      background: var(--surface);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      transition: transform 0.3s, background 0.3s;
    }
    .post:hover {
      transform: translateY(-6px);
    }
    .post h2 {
      font-size: 1.85rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
    }
    .post h2 a {
      color: var(--text);
      text-decoration: none;
      transition: opacity 0.3s;
    }
    .post h2 a:hover {
      opacity: 0.8;
    }
    .post .date {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 1rem;
    }
    .post p {
      color: var(--text-secondary);
      margin-bottom: 1.2rem;
    }
    .read-more {
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
    }
    .read-more:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <div class="logo"><img src="sources/images/logo.png" alt="LAMBDA logo"></div>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <i class="fas fa-sun sun-icon"></i>
        <i class="fas fa-moon moon-icon"></i>
      </button>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="blog.html" class="active">Blog</a>
      <a href="https://lambda.com.ai/cases">Cases</a>
    </nav>
  </header>

  <main>
    <h1>Blog</h1>

    <div class="post-list">
      <article class="post">
        <h2><a href="posts/app.html">LAMBDA Web APP is Available! Free to Use!</a></h2>
        <div class="date">January 10, 2026 </div>
        <p></p>
      </article>
      <article class="post">
        <h2><a href="posts/discussion.html">Invited Expert Discussion - "LAMBDA: A Large Model Based Data Agent"</a></h2>
        <div class="date">January 10, 2026 </div>
        <p></p>
      </article>

      <article class="post">
        <h2><a href="posts/install.html">Installation Guide: Deploy LAMBDA Locally from Scratch – Zero-Code Data Analysis Agent</a></h2>
        <div class="date">January 10, 2026 </div>
        <p></p>
      </article>

      <!-- 其他文章... -->
    </div>
  </main>

<script>
  (function() {
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    } else if (!prefersDark) {
      document.documentElement.setAttribute('data-theme', 'light');
    }

    themeToggle.addEventListener('click', function() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';

      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    });
  })();
</script>

</body>
</html>
