<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LAMBDA Blog</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="icon" type="image/png" href="../sources/images/logo.png">
  <link rel="apple-touch-icon" type="image/png" href="../sources/images/logo.png">
  <style>
    :root {
      /* Dark theme (default) */
      --bg: #0a0a0a;
      --text: #e0e0e0;
      --card: rgba(30,30,30,0.7);
      --border: #222;
      --code-bg: #1e1e1e;
      --header-bg: rgba(10,10,10,0.8);
    }

    [data-theme="light"] {
      /* Light theme */
      --bg: #f5f5f7;
      --text: #1d1d1f;
      --card: rgba(255,255,255,0.9);
      --border: rgba(0,0,0,0.1);
      --code-bg: #f0f0f0;
      --header-bg: rgba(245,245,247,0.9);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.8;
      transition: background 0.3s, color 0.3s;
    }
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 1.5rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      background: var(--header-bg);
      backdrop-filter: blur(10px);
      transition: background 0.3s;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 2rem;
    }
    .logo { font-size: 1.8rem; font-weight: 800; letter-spacing: -1px; }
    .theme-toggle {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text);
      font-size: 1.2rem;
      padding: 0.5rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      opacity: 0.7;
    }
    .theme-toggle:hover {
      opacity: 1;
      background: var(--card);
    }
    .theme-toggle .moon-icon { display: none; }
    [data-theme="light"] .theme-toggle .sun-icon { display: none; }
    [data-theme="light"] .theme-toggle .moon-icon { display: block; }
    .header-right { display: flex; align-items: center; gap: 1.5rem; }
    .back { color: var(--text); text-decoration: none; font-weight: 500; opacity: 0.8; transition: opacity 0.3s; }
    .back:hover { opacity: 1; }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 10rem 5% 6rem;
    }
    h1 {
      font-size: 3.2rem;
      font-weight: 900;
      margin-bottom: 0.4em;
      color: var(--text);
    }
    .meta {
      color: var(--text);
      opacity: 0.6;
      font-size: 1rem;
      margin-bottom: 3rem;
    }
    article {
      font-size: 1.15rem;
    }
    article h2, article h3 {
      color: var(--text);
      margin: 2.5rem 0 1rem;
    }
    article p, article li {
      margin-bottom: 1.4em;
      opacity: 0.92;
    }
    article code {
      background: var(--code-bg);
      padding: 0.2em 0.5em;
      border-radius: 4px;
      font-family: 'Consolas', monospace;
    }
    article pre {
      background: var(--code-bg);
      padding: 1.5rem;
      border-radius: 12px;
      overflow-x: auto;
      margin: 1.5em 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <div class="logo">λ Blog</div>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <i class="fas fa-sun sun-icon"></i>
        <i class="fas fa-moon moon-icon"></i>
      </button>
    </div>
    <div class="header-right">
      <a href="../blog.html" class="back">← Return the blog list</a>
    </div>
  </header>

  <main>

<script>
  (function() {
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    } else if (!prefersDark) {
      document.documentElement.setAttribute('data-theme', 'light');
    }

    themeToggle.addEventListener('click', function() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';

      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    });
  })();
</script>

</body>
</html>
